# Tritel Systems Training Portal (static site in training-portal/).
# The Odoo modules in this repository are not built or deployed by Netlify.
[build]
  base    = "training-portal"
  command = "npm run build"     # generates index/tags/fields/states/illustrations, builds, then checks links
  publish = "dist"

  # Skip the build when a push changes only Odoo modules (paths relative to the base directory)
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../training"

[build.environment]
  NODE_VERSION = "22.12.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Starlight builds dist/404.html; Netlify serves it for unknown paths automatically.
