type: screen
title: Opening a delivery project from a won tender
desc: A won tender in Tender Manager with the Open Delivery Project button, and the Open Delivery Project window with the won tender, client, award date, existing project, project name, project manager, start date and cost account, numbered 1 to 7.
source: tritel_project_delivery/views/tender_views.xml (tender_form_delivery); wizards/open_project_wizard_views.xml (delivery_project_open_wizard_form)
