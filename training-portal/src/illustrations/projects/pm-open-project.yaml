            - [{label: "", value: ""}, {label: Start date, value: 09/02/2026}]
            - [{label: Cost account, value: "Leave empty to create a new cost account", tone: muted, n: 6}]
        - text: "A new cost account will be created in a new plan named after the project."
        - buttons: [{label: Open Delivery Project, primary: true, n: 7}, {label: Cancel}]
