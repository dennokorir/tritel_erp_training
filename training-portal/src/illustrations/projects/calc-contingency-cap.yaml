type: calc
title: Contingency cap
desc: Worked example where contingency of 6% of other costs is 5.7% of the budget total, above the 5% cap, so Confirm for Approval stops with a message.
source: tritel_project_delivery/models/baseline.py (action_confirm, contingency cap check)
heading: Contingency set to 6% of other costs, cap 5%
inputs:
  - {label: Other costs, value: "1,000,000"}
  - {label: "% of other costs", value: "6%"}
  - {label: Contingency cap (%), value: "5%"}
steps:
  - {label: "Contingency: 6% × 1,000,000", value: "60,000"}
  - {label: "Budget total, contingency included", value: "1,060,000"}
  - {label: "Limit: 5% × 1,060,000", value: "53,000"}
  - {label: "Contingency share of the budget: 60,000 ÷ 1,060,000", value: "5.7%", tone: bad}
result: {label: Confirm for Approval, value: "Stopped", tone: bad}
note: "Message: Contingency is 5.7% of the budget; the limit is 5.0%. With a 5% cap, the most you can enter is about 5.26% of other costs."
