type: screen
title: Confirming a baseline for approval
desc: A draft delivery baseline with the Confirm for Approval and Withdraw buttons, the budget figures and the Approvals tab that lists who has confirmed and approved it, numbered 1 to 4.
source: tritel_project_delivery/views/baseline_views.xml (baseline_form, header and Approvals tab)
frame:
  grid: true
  app: Project
  menu: [Projects, My Tasks, My Actions, {label: Delivery, active: true}, Reporting]
  breadcrumb: [Delivery Projects, PRJ Customer A network upgrade · baseline v1]
blocks:
  - buttons: [{label: Confirm for Approval, primary: true, n: 2}, {label: Withdraw}]
    status: {steps: [Draft, Waiting for approval, Approved], current: Draft, n: 3}
  - title: {text: PRJ Customer A network upgrade, sub: "Baseline v1 · Original"}
  - fields:
      - [{label: Completion date, value: 30/06/2026, n: 1}, {label: Expected revenue, value: "KES 1,500,000"}]
      - [{label: Budget total, value: "KES 1,050,000"}, {label: Margin left, value: "KES 450,000", tone: good}]
      - [{label: Contingency, value: "KES 50,000"}, {label: Margin left (%), value: "30.0"}]
  - tabs: {items: [Costs, Summary by category, Milestones, Approvals], active: Approvals, n: 4}
  - columns:
      - {panel: true, blocks: [{heading: Submitted}, {fields: [[{label: Confirmed By, value: ""}], [{label: Confirmed On, value: ""}]]}]}
      - {panel: true, blocks: [{heading: Approvals}, {fields: [[{label: Dates approved by, value: ""}], [{label: Budget approved by, value: ""}], [{label: Approved On, value: ""}]]}]}
  - text: "Head of Delivery approves dates and every revision. Finance approves the original budget and any budget change. The MD also approves a revision whose budget is above the original by more than the set share, or whose completion date is later than the original by more than the set days."
