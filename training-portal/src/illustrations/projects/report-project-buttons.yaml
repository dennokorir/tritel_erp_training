type: screen
title: Project smart buttons
desc: The top of a delivery project with its smart buttons, Delivery baseline, Approved delivery budget, Spent so far, Committed, Budget left, Cost account, Won tender, Handover, Purchase orders, Vendor bills, Odoo budget lines, Untagged tender order lines and Automatic tagging rules, numbered 1 to 13.
source: tritel_project_delivery/views/buttons_views.xml (project_form_buttons), views/closeout_views.xml (project_form_closeout), models/buttons.py (_compute_buttons)
frame:
