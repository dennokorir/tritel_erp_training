      - {label: "Plan: Customer A…", value: "Customer A netw…", n: 6}
      - {label: TND-2026-001, value: "Tender", n: 7}
      - {label: Handover, value: "Waiting", tone: warn, n: 8}
  - smart:
      - {label: Orders, value: "3", n: 9}
      - {label: Bills, value: "4", n: 10}
      - {label: Odoo budget lines, value: "8", n: 11}
      - {label: Untagged lines, value: "2", tone: warn, n: 12}
