type: screen
title: Keying a whole order as cost items
desc: The Costs tab of a draft baseline where a supplier's purchase order is keyed as two cost items, one per type, each with quantity 1, unit lot, the order amount before VAT in US dollars, Quoted basis and the order number as Reference, with the indicative-rate warning and the quote files check, numbered 1 to 6.
source: tritel_project_delivery/views/baseline_views.xml (baseline_form, Costs tab); views/budget_mapping_views.xml (baseline_form_quote_files)
