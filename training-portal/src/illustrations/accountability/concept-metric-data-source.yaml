type: screen
title: A target fed by a metric
desc: The Data Source group of a target form, with the Metric, Measure Over, Automatic Reviews and Reference Target fields, the Provisional current value with its Refresh link, and the How it's calculated tab, numbered 1 to 5.
source: tritel_accountability_framework/views/accountability_target_views.xml (accountability_target_view_form, Data Source group and How it's calculated page)
frame:
  grid: true
  app: Accountability
  menu: [{label: My Performance, active: true}, My Team, My Actions]
  breadcrumb: [My Targets, Pipeline three times the revenue target]
blocks:
