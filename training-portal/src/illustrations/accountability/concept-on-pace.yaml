# docs-sync: shows tritel_accountability_framework:selection:accountability.review.session.employee.avg_rating, tritel_accountability_framework:selection:accountability.review.session.line.line_rating, tritel_accountability_framework:selection:accountability.snapshot.line.rating
# docs-sync: shows tritel_accountability_framework:selection:accountability.snapshot.rating, tritel_accountability_framework:selection:accountability.target.rating, tritel_accountability_framework:view_ext:hr.view_employee_form:field:rating
type: calc
title: Rated on pace
desc: A worked example of an on-pace rating for a running-total target, comparing the actual with what was expected by the last review date rather than with the full-year target.
source: tritel_accountability_framework/models/accountability_rating.py (target rating, on pace)
heading: "Revenue target, period to date, FY 2026 (1 Jan – 31 Dec)"
inputs:
  - {label: Target Value, value: "12,000,000"}
  - {label: Last review covers up to, value: "31 Oct 2026"}
  - {label: Actual, value: "8,500,000"}
steps:
  - {label: "Share of the year gone = 304 ÷ 365 days", value: "83.3%"}
  - {label: "Expected by then = 12,000,000 × 83.3%", value: "9,994,521"}
  - {label: "Rating score = 8,500,000 ÷ 9,994,521 × 100", value: "85.0%"}
  - {label: "Against the full target = 8,500,000 ÷ 12,000,000 × 100", value: "70.8%"}
result: {label: Rating, value: "Outstanding (85.0% on pace)", tone: good}
bars:
  - {label: On pace, value: 85, tone: good}
  - {label: Full target, value: 70.8, tone: accent}
note: The score against the full target (70.8%) is still shown. The rating uses the on-pace figure while the period is open.
