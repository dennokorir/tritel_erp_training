type: screen
title: A frozen performance snapshot
desc: A Performance Snapshot form, with the Compare with today's rebuild and Print PDF buttons, the Overall and Frozen groups, and the list of targets as they stood on the date, numbered 1 to 4.
source: tritel_accountability_framework/views/accountability_snapshot_views.xml (accountability_snapshot_view_form)
frame:
  grid: true
  app: Accountability
  menu: [{label: My Performance, active: true}, My Team, My Actions]
  breadcrumb: [Performance Snapshots, "Employee A · as at 30/09/2026"]
blocks:
  - buttons: [{label: "Compare with today's rebuild", primary: true, n: 1}, {label: Print PDF}]
  - title: {text: Employee A, sub: "As at 30/09/2026 · FY 2026"}
  - columns:
      - panel: true
        blocks:
          - heading: Overall
            n: 2
          - fields:
              - [{label: Rating, value: Exceeds Expectations, tone: good}]
              - [{label: Rating score (%), value: "74.0"}]
              - [{label: Own (%), value: "74.0"}]
      - panel: true
        blocks:
          - heading: Frozen
            n: 3
          - fields:
              - [{label: Taken on, value: "03/10/2026 06:00"}]
              - [{label: Taken by, value: OdooBot}]
              - [{label: Taken, value: Month end}]
  - table:
      columns: [Target, Actual, Target value, Expected by then, On pace, Score (%), Rating]
      widths: [3, 1.5, 1.5, 1.6, 1, 1.2, 2]
      rows:
        - [Invoiced revenue, "6,800,000", "12,000,000", "9,000,000", "✓", "56.7", {text: Exceeds Expectations, badge: true, tone: good}]
        - [Customer visits per month, "10", "12", "", "", "83.3", {text: Outstanding, badge: true, tone: good}]
    n: 4
