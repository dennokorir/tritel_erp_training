type: screen
title: Performance Overview, your own figures
desc: The Performance Overview screen in Accountability with the period and As at selectors, the figure tiles, your row in the list, and the side panel showing your Own and Composite scores, rating and targets, numbered 1 to 6.
source: tritel_accountability_framework/static/src/cascade/accountability_cascade_dashboard.xml (CascadeDashboard)
frame:
  grid: true
  app: Accountability
  menu: [{label: My Performance, active: true, n: 1}, My Actions]
  breadcrumb: [Performance Overview]
blocks:
  - title: {text: Org Performance Cascade, sub: "Period and As at selectors sit in the dark header"}
  - buttons: [{label: "FY 2026 ●", n: 2}, {label: "As at today (live)"}, {label: List}, {label: Organogram}, {label: Focus}]
  - tiles:
