      - {label: Targets, value: "4"}
      - {label: Reviewed, value: "2"}
  - columns:
      - panel: true
        blocks:
          - table:
              columns: [Name, Score]
              widths: [3, 1]
              rows:
                - {cells: [Employee A, {text: "72%", badge: true, tone: good}], highlight: true, n: 4}
      - panel: true
        blocks:
          - heading: Employee A
          - text: "Individual Contributor · Open snapshot"
          - smart: [{label: Own, value: "72%", tone: good, n: 5}, {label: Composite, value: "72%", tone: good}]
          - text: "Composite = 100% Own Score"
          - table:
              columns: [Targets (2/4 reviewed), Score]
              widths: [3, 1]
              rows:
                - [Grow qualified pipeline, "90%"]
                - [Customer visits per month, "67%"]
              n: 6
