type: screen
title: Your team's scores
desc: The Team Scores screen with the period and As at selectors, the scope buttons, the summary cards, the status chips and one row per person with Overall, Own, Team, Status, change on last period, targets scored and the Team and Scorecard buttons, numbered 1 to 7.
source: tritel_accountability_framework/static/src/team_scores/accountability_team_scores.xml
frame:
  grid: true
  app: Accountability
  menu: [Company Overview, My Performance, {label: My Team, active: true}, My Actions, Organisation]
  breadcrumb: [Team Scores]
blocks:
  - buttons: [{label: FY 2026, n: 1}, {label: "As at today (live)"}, {label: Direct reports, primary: true, n: 2}, {label: Whole reporting line}, {label: Export / list}]
  - tiles: [{label: "Team average (overall)", value: "63.7%", tone: good, n: 3}, {label: Where the team stands, value: "1 · 1 · 1"}, {label: Biggest moves, value: "+4.0 Employee B"}]
  - buttons: [{label: All 3}, {label: Needs Improvement 1}, {label: Meets Expectations 1}, {label: Exceeds Expectations 1, n: 4}]
  - table:
      columns: [Person, Overall, Own, Team, Status, vs last period, Targets scored, ""]
      widths: [2.3, 1, 0.9, 0.9, 2.2, 1.2, 1.2, 1.7]
      rows:
        - {cells: [Employee B, {text: "72.0%", bold: true}, "70.0%", "73.3%", {text: Exceeds Expectations, badge: true, tone: good}, {text: "+4.0", tone: good}, "4 / 5", {text: "Team ▾ · Scorecard", tone: accent}], highlight: true, n: 5}
        - [Employee C, {text: "64.0%", bold: true}, "64.0%", "—", {text: Meets Expectations, badge: true, tone: accent}, "—", "3 / 4", Scorecard]
        - [Employee D, {text: "55.0%", bold: true}, "55.0%", "—", {text: Needs Improvement, badge: true, tone: warn}, {text: "-2.0", tone: bad}, "2 / 4", Scorecard]
  - note: {text: "How the team score is reached: Employee E 80.0% · Employee F 60.0% (half the period). Team score = 73.3%. Own 40% × 70.0% + Team 60% × 73.3% = 72.0%", tone: accent, n: 6}
  - buttons: [{label: Freeze team snapshot, n: 7}]
