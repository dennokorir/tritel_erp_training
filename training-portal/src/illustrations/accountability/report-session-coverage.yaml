type: screen
title: Review Coverage
desc: The Review Coverage grid with the period and cadence selectors, one row per manager with team size, one cell per review window showing done, in progress, draft, not run or not yet due, and the Run on time column, numbered 1 to 5.
source: tritel_accountability_framework/static/src/session_coverage/accountability_session_coverage.xml
frame:
  grid: true
  app: Accountability
  menu: [Company Overview, My Performance, My Team, My Actions, {label: Organisation, active: true}]
  breadcrumb: [Review Coverage]
blocks:
  - buttons: [{label: FY 2026, n: 1}, {label: Monthly, n: 2}]
  - table:
      columns: [Manager, Team, Jul 2026, Aug 2026, Sep 2026, Oct 2026, Run on time]
      widths: [2.4, 0.8, 1.6, 1.6, 1.6, 1.4, 1.3]
      rows:
        - {cells: [Employee B, "4", {text: "✓ Done avg 72%", tone: good}, {text: "✓ Done avg 70%", tone: good}, {text: "◔ 60% scored", tone: warn}, not yet due, {text: "2 / 2", bold: true, tone: good}], n: 3}
        - {cells: [Employee F, "3", {text: "✓ Done avg 65%", tone: good}, {text: "✕ Not run", tone: bad}, {text: "✎ Draft", tone: muted}, not yet due, {text: "1 / 3", bold: true, tone: bad}], n: 4}
        - [Employee G, "2", "—", "—", {text: "✓ Done avg 81%", tone: good}, not yet due, {text: "1 / 1", bold: true, tone: good}]
  - text: "✓ done · ◔ in progress · ✎ draft · ✕ window finished, no session · — no team targets due in that window"
  - note: {text: "Employee F · Aug 2026: Window finished with no session · click to start one", tone: bad, n: 5}
