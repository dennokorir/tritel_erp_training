type: calc
title: Number target score
desc: Worked example of a number target where higher is better, scored on the part the owner kept after cascading 4,000,000 of a 10,000,000 target, giving 75%.
source: tritel_accountability_framework/models/accountability_target.py (_quantitative_score, _score_quantitative)
heading: Number target, higher is better (part of it cascaded)
inputs:
  - {label: Target Value, value: "10,000,000"}
  - {label: Adopted by the team, value: "4,000,000"}
  - {label: Actual, value: "4,500,000"}
steps:
  - {label: "Measured On = Target Value − shares your team adopted", value: "6,000,000"}
  - {label: "Score = Actual ÷ Measured On × 100", value: "4,500,000 ÷ 6,000,000 × 100"}
  - {label: "Cap at 100%", value: "75% (no cap needed)"}
result: {label: Score (%), value: "75%", tone: good}
note: Lower is better works the other way round - Target ÷ Actual × 100. A target of 5 incidents with 8 actual scores 62.5%. An entered 0 scores 100%.
