# docs-sync: verified_commit eec18b485b6c
# docs-sync: shows e_board:model:accountability.board.review.line
type: calc
title: Payroll employer cost
desc: Worked example of the Payroll tab for 2026 to date, where gross pay of KES 10,000,000 plus employer NSSF of 200,000 and employer Housing Levy of 150,000 gives a Total Employer Cost of 10,350,000, and gross is 11.1% up on 9,000,000 for the same months of 2025.
source: e_board/controllers/e_board_controller.py (_get_payroll_stats, _payroll_donut)
heading: 1 Jan to 16 Nov 2026, done or paid payslips (KES)
inputs:
  - {label: Gross pay, value: "10,000,000"}
  - {label: Employer NSSF, value: "200,000"}
  - {label: Housing Levy (employer), value: "150,000"}
  - {label: "Gross pay, 1 Jan to 16 Nov 2025", value: "9,000,000"}
steps:
  - {label: "Total Employer Cost: 10,000,000 + 200,000 + 150,000", value: "10,350,000"}
  - {label: "Shown on the tile as millions to two decimals", value: "10.35M"}
  - {label: "Year on year: (10,000,000 − 9,000,000) ÷ 9,000,000 × 100", value: "+11.1% vs prior year"}
result: {label: Total Employer Cost, value: "10.35M KES", tone: accent}
note: Employee deductions (PAYE, employee NSSF, NHIF/SHA, employee Housing Levy) are part of gross pay, so they are not added again.
