type: calc
title: A quarter of bids for one Bid Liaison
desc: Worked example of Employee B's Bid Quality Score for Q3 2026, where a must-win bid scored 90% counts three times, another bid scored 80%, a confirmed disqualification caused by the Bid Liaison counts as 0% and an unscored bid is left out, giving 70%.
source: tritel_accountability_framework/models/metric_hook_bid_quality.py
heading: "Employee B (Bid Liaison), Bid Quality Score, Q3 2026"
inputs:
  - {label: "TND-2026-011, must-win", value: "90%"}
  - {label: "TND-2026-012", value: "80%"}
  - {label: "TND-2026-013, DQ", value: "0%"}
  - {label: "TND-2026-014", value: "not scored"}
steps:
  - {label: "Must-win counts three times: 90 × 3", value: "270"}
  - {label: "Add the others: 270 + 80 + 0", value: "350"}
  - {label: "Weights: 3 + 1 + 1 (the unscored bid is left out)", value: "5"}
  - {label: "Bid Quality Score = 350 ÷ 5", value: "70%"}
result: {label: Fetched value for the quarter, value: "70%", tone: warn}
note: The metric waits 14 days after the quarter ends, so a quality check scored within the 10 days still counts. TND-2026-014 counts once its manager scores it.
