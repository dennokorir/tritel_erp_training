type: screen
title: Account Plans settings
desc: The Account Plans section of Settings under Tender Tracker, with the Due dates box (Plan approved by, Review due, Grace days) and the Reminders and escalation box (reminder and escalation days, Escalations go to, Weekly summary), showing the default values, numbered 1 to 3.
