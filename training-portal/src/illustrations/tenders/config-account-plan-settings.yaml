              - [{label: "First reminder, days before due", value: "14", n: 2}]
              - [{label: "Then every (working days)", value: "3"}]
              - [{label: "Remind the supervisor after (working days)", value: "2"}]
              - [{label: "Escalate waiting approvals after (working days)", value: "5"}]
              - [{label: "Escalate overdue after (working days)", value: "5"}]
