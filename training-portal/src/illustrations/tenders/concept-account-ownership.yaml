  - buttons: [{label: Accept Suggestion, primary: true, n: 1}, {label: Assign To…}, {label: Mark as Company}, {label: Claim for Me, n: 2}]
  - table:
      columns: [Customer, Account Manager, Suggested Owner, Why, Coverage, Tenders]
      widths: [3, 2, 2, 4, 2, 1]
      n: 3
      rows:
