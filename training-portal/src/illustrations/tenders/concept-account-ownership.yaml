type: screen
title: The Account Ownership list
desc: The Account Ownership list of customers that need an owner, with the Accept Suggestion, Assign To, Mark as Company and Claim for Me buttons, and columns for the current account manager, the Suggested Owner and Why, Coverage and counts of tenders, opportunities and touches, numbered 1 to 3.
source: tritel_tender_tracker/views/account_ownership_views.xml; models/account_ownership.py
frame:
  grid: true
  app: Tender Manager
  menu: [Tenders, My Actions, {label: Tender Customers, active: true}, Reporting]
  breadcrumb: [Account Ownership]
blocks:
