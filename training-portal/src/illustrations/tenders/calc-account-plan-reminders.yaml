type: calc
title: Reminders for a quarterly review
desc: Worked timeline of the reminder emails for the Q1 2026 review of Customer A's plan with the default settings, once the reminders job is turned on, the account manager is reminded from 31 March every 3 working days, submits on 9 April, the supervisor is reminded on 13 and 15 April and the Head of Commercial is told on 16 April.
source: tritel_tender_tracker/models/account_plan_tracking.py (_cron_plan_reminders, working_days), tritel_tender_tracker/data/account_plan_cron.xml
heading: Customer A · Q1 2026 review, due 14 Apr 2026
inputs:
  - {label: First reminder, value: "14 days before due"}
  - {label: Then every, value: "3 working days"}
  - {label: Remind the supervisor after, value: "2 working days"}
  - {label: Escalate waiting approvals after, value: "5 working days"}
steps:
  - {label: "Account manager: Account plans due", value: "Tue 31 Mar, Fri 3 Apr, Wed 8 Apr"}
