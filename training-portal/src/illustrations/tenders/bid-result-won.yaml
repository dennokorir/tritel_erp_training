type: screen
title: Recording a win
desc: A tender in Evaluation with the Won, Prequalified, Lost and Cancel buttons, and the Mark as Won window with the Award Date, Note and Save, numbered 1 to 6.
source: tritel_tender_tracker/views/tender_views.xml (view_tender_form); views/tender_workflow_views.xml (tender_move_wizard_form); models/tender_workflow.py
frame:
  grid: true
  app: Tender Manager
  menu: [{label: Tenders, active: true}, My Actions, Tender Customers, Commercial Targets]
