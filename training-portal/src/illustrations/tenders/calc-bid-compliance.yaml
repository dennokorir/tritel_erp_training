desc: Worked example of Bid Compliance for a Technical Presales engineer, with a compliant must-win bid counting three times at 100%, a compliant bid at 100% and a confirmed disqualification caused by Technical Presales at 0%, giving 400 points over a weight of 5, or 80.0%.
