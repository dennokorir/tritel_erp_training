type: calc
title: Estimated gross profit and margin
desc: Worked example of a business case's estimate, with Expected Revenue of KES 10,000,000 and cost lines of KES 5,200,000 (USD 40,000 at 130), KES 800,000 and KES 1,000,000, giving Total Cost of 7,000,000, Gross Profit of 3,000,000 and a Gross Margin of 30.0%.
source: tritel_tender_tracker/models/tender_business_case.py (_compute_totals, _compute_subtotal)
heading: Business case for TND-2026-012 (KES)
inputs:
  - {label: Expected Revenue, value: "10,000,000"}
  - {label: Hardware, value: "USD 40,000"}
  - {label: Labour (Internal), value: "800,000"}
  - {label: Subcontractors, value: "1,000,000"}
steps:
  - {label: "Hardware in KES: 40,000 × 130 (today's rate)", value: "5,200,000"}
  - {label: "Total Cost: 5,200,000 + 800,000 + 1,000,000", value: "7,000,000"}
  - {label: "Gross Profit: 10,000,000 − 7,000,000", value: "3,000,000"}
  - {label: "Gross Margin (%): 3,000,000 ÷ 10,000,000 × 100", value: "30.0"}
result: {label: Margin (Est.), value: "30.0%", tone: good}
note: The Margin card is green from 20%, amber from 10% to under 20%, and red below 10%.
