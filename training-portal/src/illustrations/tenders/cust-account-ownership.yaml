  - buttons: [{label: Accept Suggestion, primary: true, n: 3}, {label: Assign To…, n: 4}, {label: Mark as Company}, {label: Claim for Me, n: 2}]
  - search: {facets: ["Needs Owner (engaged, no AM)"], placeholder: "Search…", filters: [Filters, Group By]}
