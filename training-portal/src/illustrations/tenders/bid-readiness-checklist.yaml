type: screen
title: Working the bid readiness checklist
desc: The Bid Readiness tab of a tender in Bidding with Readiness and Progress, the Confirm Ready button, and checklist rows showing Document, Prepared By, Document Files, Valid Until, Not Needed and Status, numbered 1 to 7.
source: tritel_tender_tracker/views/bid_desk_views.xml (view_tender_form_bid_desk); models/bid_desk.py; data/bid_desk_data.xml
frame:
  grid: true
  app: Tender Manager
  menu: [{label: Tenders, active: true}, My Actions, Tender Customers, Commercial Targets]
  breadcrumb: [Tenders, Campus Wi-Fi upgrade]
blocks:
  - buttons: [{label: Mark Submitted, primary: true}, {label: Drop}, {label: Cancel}]
    status: {steps: [Draft, Bidding, Evaluation], current: Bidding}
  - tabs: {items: [Tender Info, Documents, Competition, Bid Readiness], active: Bid Readiness, n: 1}
  - fields:
      - [{label: Readiness, value: In Progress, readonly: true}, {label: Progress, value: "4 of 7 ready", readonly: true, n: 6}]
      - [{label: Submission Deadline, value: "04/12/2026 10:00:00", readonly: true}]
  - buttons: [{label: Confirm Ready, primary: true, n: 7}]
  - table:
      columns: [Document, Prepared By, Document Files, Valid Until, Not Needed, Status]
      widths: [5.6, 2.9, 1.9, 2, 1.7, 2]
      rows:
        - [Signed form of tender, Bid Liaison, form.pdf, "", "☐", {text: Ready, badge: true, tone: good}]
        - [Certificate of incorporation and CR12, Bid Liaison, cr12.pdf, "", "☐", {text: Ready, badge: true, tone: good}]
        - {cells: [Tax compliance certificate, Bid Liaison, tcc.pdf, 30/11/2026, "☐", {text: Expired, badge: true, tone: bad}], n: 3}
        - ["Licences and accreditations, such as ICTA", Bid Liaison, icta.pdf, 31/12/2026, "☐", {text: Ready, badge: true, tone: good}]
        - {cells: [Manufacturer authorisation letter, Technical Presales, "", "", "☐", {text: Missing, badge: true, tone: bad}], n: 2}
        - [Technical compliance response, Technical Presales, response.pdf, "", "☐", {text: Ready, badge: true, tone: good}]
        - {cells: [Financial proposal, Bid Liaison, "", "", "☑", {text: Not Needed, badge: true, tone: muted}], n: 4}
        - {cells: [Site visit certificate, Bid Liaison, "", "", "☐", {text: Missing, badge: true, tone: bad}], n: 5}
