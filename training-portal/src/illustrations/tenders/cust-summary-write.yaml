type: screen
title: Write a project summary
desc: The project summary workspace while the writer is writing, with the due date and headings progress, the summary text under its headings, the Classification box, the Headings checklist and the Submit for review button, numbered 1 to 6.
source: tritel_tender_tracker/views/project_summary_views.xml (tender_summary_workspace_form)
