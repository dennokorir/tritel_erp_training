type: screen
title: Adjust a balance in Leave Coverage
desc: Leave Coverage with Employee A's Annual Leave cell selected and the side panel open, showing the Allocated, Taken, Requested and Left totals, the statement lines including an earlier adjustment, and the Adjust Annual Leave form with Days, Reason and Apply, numbered 1 to 5.
