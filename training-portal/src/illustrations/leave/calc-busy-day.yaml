type: calc
title: Busy day
desc: Worked example of the busy day threshold, with 12 people shown and the default 20%, so a day is busy when 3 or more of them are away; Tuesday has 3 people away and is flagged busy.
source: tritel_hr_leave/models/presence.py (_busy_threshold, get_presence_data)
heading: Team Presence, week of 30 Nov 2026
inputs:
  - {label: People shown, value: "12"}
