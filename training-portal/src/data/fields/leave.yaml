# Field reference for Time Off (tritel_hr_leave), grouped by screen. Labels are exactly as on screen.
# Source: tritel_hr_leave views (leave_approval_views.xml, presence_views.xml, employee_visibility_views.xml,
# leave_home_portal.xml), the Time Off home and Team Presence screens (static/src/home/leave_home.xml,
# static/src/presence/team_presence.xml) and models (presence.py, leave_home.py, hr_leave_approval.py).
screens:
  - name: My Leave
    where: Time Off › Home › My Leave, or Time Off › My Time Off › My Leave; portal /my/leave
    fields:
      - {label: "<type> balance", meaning: "What you can still request of your main leave type: Allocated − Taken − Requested.", where: Top}
      - {label: allocated so far, meaning: "Days allocated this year, including any accrued, carried over or granted.", where: Under the balance}
      - {label: taken, meaning: "Approved time off this year, including approved days still to come.", where: Under the balance}
      - {label: requested, meaning: "Time off waiting for approval.", where: Under the balance}
      - {label: by 31 Dec, meaning: "For leave that builds up each month: what you will have been allocated by the end of the year.", where: Under the balance}
      - {label: Next, meaning: "The date and size of the next accrual.", where: Top}
      - {label: "<sick type> left", meaning: "Sick days left of the allocation, with the days taken this year.", where: Top}
      - {label: Waiting for approval, meaning: "Your oldest waiting request and how many more are waiting.", where: Top}
      - {label: "Requests in <year>", meaning: "This year's requests with their status: Waiting for approval, Waiting for HR, Approved or Refused.", where: Left}
      - {label: Your team this week, meaning: "Colleagues with the same manager, In all week or Away on which days.", where: Right}
      - {label: Taken each month, meaning: "Approved days taken each month this year, sick leave left out.", where: Bottom}

  - name: My Team
    where: Time Off › Home › My Team; portal /my/team-leave
    fields:
      - {label: You, meaning: "Your own balance, sick days left and waiting requests.", where: Top line}
      - {label: Who is in this week, meaning: "Your team's week, as in Team Presence, busiest people first, up to 12.", where: Left}
      - {label: Waiting for you, meaning: "Time off requests you can decide now.", where: Right}
      - {label: "Direct reports, Everyone below me, Everyone in the company", meaning: "Who the balances table lists. Everyone in the company is only for the Company-wide Time Off View list.", where: Team balances}
      - {label: Allocated, meaning: "Main leave type allocated this year, accrued plus carried over or granted.", where: Team balances}
      - {label: Taken, meaning: "Approved this year, including approved days still to come.", where: Team balances}
      - {label: Requested, meaning: "Waiting for approval.", where: Team balances}
      - {label: Balance, meaning: "Allocated − Taken − Requested: what can still be requested.", where: Team balances}
      - {label: Used this year, meaning: "A bar of taken and requested days against the allocation.", where: Team balances}
      - {label: Sick left, meaning: "Sick days left, when the person has a sick leave allocation.", where: Team balances}
      - {label: "Low, Not taking leave, No allocation, OK", meaning: "The flag on each person, from the thresholds HR sets.", where: Team balances}

  - name: Team Presence
    where: Time Off › Team Presence; portal /my/presence
    fields:
      - {label: "Week, Month", meaning: "The period shown: Monday to Friday of one week, or every working day of a month.", where: Toolbar}
      - {label: "Grid, Calendar", meaning: "People by day, or a month calendar listing who is away each day.", where: Toolbar}
      - {label: Download Excel, meaning: "The period as shown, with these filters, as an Excel file. Time Off administrators and the Company-wide Time Off View list only.", where: Toolbar}
      - {label: Department, meaning: "Show one department.", where: Filters}
      - {label: Type, meaning: "Show or hide each leave type. Only applies to people you see in full.", where: Filters}
      - {label: "Status: Approved, Requested", meaning: "Show approved time off, requests waiting for approval, or both.", where: Filters}
      - {label: Only people away, meaning: "Leave out people with no time off in the period.", where: Filters}
      - {label: Showing, meaning: "Whose presence you see: Everyone, Your reporting line or You and your team.", where: Summary}
      - {label: busy days, meaning: "Days when at least the busy share of the people shown are away.", where: Summary}
      - {label: Away today, meaning: "Who is away today, this week only.", where: Summary}
      - {label: Away each day, meaning: "How many people are away each day; busy days in red, public holidays as PH.", where: Grid}
      - {label: In or Away only, meaning: "Under a colleague's name: you see whether they are in, not why.", where: Grid}
      - {label: Days, meaning: "Days away in the period, half days as 0.5.", where: Grid}

  - name: Time off request
    where: Time Off › Approvals › Time Off, a request (Approval section)
    fields:
      - {label: Waiting since, meaning: "When the request reached the step it is waiting on.", where: Approval}
      - {label: Reminder sent, meaning: "When the approver was reminded.", where: Approval}
      - {label: Escalated on, meaning: "When the request was escalated.", where: Approval}
      - {label: Escalated to, meaning: "Who it was escalated to; they can now decide it.", where: Approval}
      - {label: Question open, meaning: "The approver asked a question that the employee hasn't answered yet.", where: Approval}

  - name: Approvals & Presence
    where: Time Off › Configuration › Approvals & Presence
    fields:
      - {label: Remind the approver after (working days), meaning: "When the approver is reminded of a waiting request. 2 to start with.", where: Window}
      - {label: Escalate after (working days), meaning: "When the request goes to the approver's own manager. 4 to start with.", where: Window}
      - {label: Or escalate this many days before the leave starts, meaning: "Escalate earlier when the leave is this close. 2 to start with.", where: Window}
      - {label: Refuse requests still waiting for the manager when the leave starts, meaning: "Refuse requests at the manager's step once the leave has started. On to start with.", where: Window}
      - {label: "Escalate to, when the approver has no manager", meaning: "Who gets escalations when the approver has no manager. Empty: the Time Off administrators.", where: Window}
      - {label: "Team Presence: busy when this % of the people shown are away", meaning: "The busy-day share. 20 to start with.", where: Team Presence}
      - {label: "My Team: flag as low at or below (days balance)", meaning: "Balance at which a person is flagged Low. 3 to start with.", where: My Team balances}
      - {label: "My Team: flag \"not taking leave\" at (% of allocation in balance)", meaning: "Share of the allocation still in balance that flags Not taking leave. 60 to start with.", where: My Team balances}
      - {label: From month (1–12), meaning: "Month from which Not taking leave is flagged. 10 (October) to start with.", where: My Team balances}

  - name: Company-wide Time Off View
    where: Time Off › Configuration › Company-wide Time Off View
    fields:
      - {label: User, meaning: "The person who gets the whole-company view.", where: List}
      - {label: Why, meaning: "A note on why they need it.", where: List}

  - name: Employee form (Time Off)
    where: Employees › Employees, an employee
    fields:
      - {label: Hide from Time Off views, meaning: "Button at the top, and a tick box on the HR Settings tab under Status: leave this record out of the Time Off people lists.", where: "Header, HR Settings"}
      - {label: Show in Time Off views, meaning: "Button at the top: bring a hidden record back.", where: Header}
